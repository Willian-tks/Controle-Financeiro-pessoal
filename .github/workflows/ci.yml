name: DOMUS CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LOCAL_DEV_FORCE_SQLITE: '1'
      DATABASE_URL: ''
      JWT_SECRET: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
            requirements-dev.lock
      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  postgres-tests:
    name: Investment regression (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: domus_ci
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: domus_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domus_ci -d domus_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOCAL_DEV_FORCE_SQLITE: '1'
      DATABASE_URL: ''
      JWT_SECRET: ci-only-not-a-production-secret
      DOMUS_POSTGRES_TEST_URL: postgresql://domus_ci:ci-only-disposable@127.0.0.1:5432/domus_ci_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Test real PostgreSQL schema, FX and tenant isolation
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v

  frontend-build:
    name: Frontend build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reject tracked installed dependencies
        run: |
          if [ -n "$(git ls-files node_modules)" ]; then
            echo 'node_modules must not be tracked in Git.'
            exit 1
          fi
      - name: Install dependencies from lockfile
        run: npm ci --include=dev --include=optional
      - name: Build frontend from source
        run: npm run build -- --outDir dist-next
      - name: Check generated entry point
        run: test -s dist-next/index.html
